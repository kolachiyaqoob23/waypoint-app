<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waypoint: adaptive learning paths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top" id="top">
  <button class="brand" data-action="home" aria-label="Waypoint home">Waypoint</button>
  <span class="tag" id="tag">Adaptive learning paths</span>
  <span class="spacer"></span>
  <nav class="usernav" id="usernav" hidden>
    <button class="btn ghost small" data-action="profile" id="who"></button>
    <button class="btn ghost small" data-action="logout">Log out</button>
  </nav>
</header>
<main id="app" tabindex="-1"><p class="muted">Loading…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
